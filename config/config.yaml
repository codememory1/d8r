# PostgreSQL connection settings.
postgres:
  # PostgreSQL hostname. Use "postgres" when the application runs inside Docker Compose.
  host: "localhost"

  # PostgreSQL server port.
  port: 5432

  # Database user.
  user: "root"

  # Database password. Suitable only for local development.
  password: "admin"

  # Database name.
  database: "postgres"

# HTTP server settings.
http:
  # Address on which the HTTP server listens. 0.0.0.0 allows all network interfaces.
  address: "0.0.0.0"

  # HTTP server port.
  port: 8080

  # Maximum duration for reading an HTTP request.
  read_timeout: "10s"

  # Maximum duration for writing an HTTP response.
  write_timeout: "20s"

  # Maximum duration to keep an idle connection open.
  idle_timeout: "20s"

# Resource inspection and download settings.
download:
  # Minimum resource size required to consider parallel downloading.
  min_parallel_size: "50MiB"

  # Buffer size used while copying response data to storage.
  buffer_size: "256KiB"

  # Target size of an individual download part.
  part_size: "5MiB"

  # Maximum number of parts downloaded concurrently.
  max_parallel_parts: 5

  # Number of byte ranges into which a resource is divided.
  range_parts: 5

  # Retry settings for HTTP downloads.
  retry:
    # Maximum number of attempts, including the initial attempt.
    max_attempts: 3

    # Delay between attempts.
    delay: "10ms"

  # Interval between periodic download progress publications.
  progress_interval: "5s"

# Background worker settings.
workers:
  # Download task worker settings.
  download:
    # Maximum number of download tasks processed concurrently.
    concurrency: 5

    # Maximum number of download tasks claimed in one batch.
    limit: 20

  # Task inspection worker settings.
  inspection:
    # Maximum number of task inspections processed concurrently.
    concurrency: 5

    # Maximum number of tasks claimed for inspection in one batch.
    limit: 20

  # Outbox event worker settings.
  outbox_event:
    # Maximum number of outbox events processed concurrently.
    concurrency: 3

    # Maximum number of outbox events claimed in one batch.
    limit: 20

  # Webhook delivery worker settings.
  webhook_delivery:
    # Maximum number of webhook deliveries processed concurrently.
    concurrency: 10

    # Maximum number of webhook deliveries claimed in one batch.
    limit: 20

# Webhook request and retry settings.
webhook:
  # Maximum duration allowed for a single webhook HTTP request.
  request_timeout: "10s"

  # Maximum number of delivery attempts before marking a webhook as failed.
  max_attempts: 5

  # Initial delay before retrying a failed webhook delivery.
  retry_delay: "5s"